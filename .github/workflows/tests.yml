name: Tests

on:
  push:
  pull_request:

jobs:
  ci:
    name: ci / 3.12
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    services:
      # The same baked multi-arch image as the dev broker (gridworks-base
      # arm.sh / x86.sh), so CI runs against the exact RabbitMQ + topology
      # developers use.
      rabbit:
        image: ghcr.io/thegridelectric/dev-rabbit:latest
        ports:
          - 5672:5672
          - 15672:15672
          - 1885:1885
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run ci.sh
        run: ./ci.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
