metadata:
  registry_version: "1.0"
  last_updated: "2026-08-14T20:10:00Z"
  maintainer: "gridworks-energy"

formats:
  hex.char:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/hex.char"
    created: "2026-05-08T16:34:06Z"
    status: "published"
    description: "Single hexadecimal character, restricted to 0-9, a-f, or A-F"

  left.right.dot:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/left.right.dot"
    created: "2022-01-01T00:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier composed of lowercase alphanumeric segments"

  non.empty.string:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/non.empty.string"
    created: "2024-12-31T15:00:00Z"
    status: "published"
    description: "String with at least one character"

  universe.run:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/universe.run"
    created: "2026-08-14T19:30:00Z"
    status: "published"
    description: "Broker-vhost form <universe>__<run>: the universe token, a double underscore, and the run number"

  utc.milliseconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.milliseconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole milliseconds since Unix epoch (2000–3000 range)"

  utc.seconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.seconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole seconds since Unix epoch (2000–3000 range)"

  uuid4.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/uuid4.str"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Canonical lowercase UUIDv4 string (RFC 4122) in 8-4-4-4-12 format"

enums:
  base.g.node.class:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Universal physical ontology classification for Grid Nodes"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/base.g.node.class/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

  g.node.instance.status:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Lifecycle state of a runtime instance tracked by FIS"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.instance.status/000"
        created: "2026-03-04T17:00:00Z"
        status: "published"

  g.node.instance.transport:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Transport protocol used by a runtime instance"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.instance.transport/000"
        created: "2026-03-03T17:00:00Z"
        status: "published"

  g.node.status:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Lifecycle status of a Grid Node within the registry"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.status/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

types:
  fis.connect.claims:
    latest_version: "000"
    owner: jessica-millar
    versioning_strategy: "literal"
    description: "Connect-time claims a principal presents at the broker gate for FIS authorization: current alias, runtime instance id, the run being joined, and GNodeClass iff the principal is a GNode."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/fis.connect.claims/000"
        created: "2026-08-14T19:30:00Z"
        summary: "Initial Sema version"
        status: "staging"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "non.empty.string"
            - "universe.run"
            - "uuid4.str"

  g.node.gt:
    latest_version: "006"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Fundamental identity object representing physical and logical grid nodes"

    versions:
      "006":
        schema_url: "https://schemas.electricity.works/types/g.node.gt/006"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- Axiom 2 (PhysicalGNodeLocations) becomes activation-conditioned: PositionPointId is mandatory only when Status is Active — a Pending physical GNode may be locationless"
        direct_dependencies:
          structural:
            - "base.g.node.class:000"
            - "g.node.status:000"
            - "left.right.dot"
            - "uuid4.str"

  g.node.instance.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Runtime execution instance of a GNode identity on one run"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/g.node.instance.gt/000"
        created: "2026-03-04T17:00:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "g.node.instance.status:000"
            - "g.node.instance.transport:000"
            - "utc.milliseconds"
            - "uuid4.str"

  gridworks.header:
    latest_version: "001"
    owner: smoothstone-computing
    versioning_strategy: "literal"
    description: "Delivery-layer metadata carried inside a gw envelope: Src, Dst, MessageType, MessageId, AckRequired."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/gridworks.header/001"
        created: "2022-10-17T16:55:39Z"
        status: "published"
        summary: "Initial published version, matching the gwproto Header wire format deployed in the field."
        direct_dependencies:
          structural:
            - "left.right.dot"

  heartbeat.a:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Lightweight supervisor-tier actor heartbeat carrying sender/peer hex tokens for bidirectional liveness."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/heartbeat.a/000"
        created: "2026-05-08T16:34:06Z"
        status: "published"
        summary: "Initial Sema version."
        direct_dependencies:
          structural:
            - "hex.char"

  sim.ready:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Actor readiness announcement for coordinated simulation time."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/sim.ready/000"
        created: "2026-05-08T18:01:43Z"
        status: "published"
        summary: "Initial Sema version."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "utc.seconds"
            - "uuid4.str"

  sim.timestep:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Simulation time-coordinator message announcing the current simulated Unix time."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/sim.timestep/000"
        created: "2026-05-08T16:48:56Z"
        status: "published"
        summary: "Initial Sema version."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "utc.milliseconds"
            - "utc.seconds"
            - "uuid4.str"

  gw:
    owner: smoothstone-computing
    versioning_strategy: "none"
    description: "GridWorks message envelope: a gridworks.header plus a Payload of any registered Sema type."
    schema_url: "https://schemas.electricity.works/types/gw"
    created: "2022-10-17T16:55:39Z"
    status: "published"
    summary: "Versionless GridWorks message envelope (gwproto Message wire format)."
    direct_dependencies:
      structural:
        - "gridworks.header:001"
